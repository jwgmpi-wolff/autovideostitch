[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autovideostitch"
version = "1.0.3"
description = "Find described scenes in videos and stitch the matches into a result video."
requires-python = ">=3.11"
dependencies = [
	"pillow>=11,<13",
	"torch>=2.6,<3",
	"transformers>=4.49,<6",
]

[project.gui-scripts]
auto-video-stitch = "autovideostitch.ui:main"

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]
build = ["pyinstaller>=6.12,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]